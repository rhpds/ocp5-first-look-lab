---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: openshift-mcp-server
  namespace: {{ .Release.Namespace }}
spec:
  host: mcp-server.{{ .Values.clusterSubdomain }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  port:
    targetPort: 8080
  to:
    kind: Service
    name: {{ .Values.name }}
