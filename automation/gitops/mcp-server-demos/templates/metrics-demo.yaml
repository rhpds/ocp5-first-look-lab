---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.metricsDemo.namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-api
  namespace: {{ .Values.metricsDemo.namespace }}
  labels:
    app: mcp-demo
    scenario: metrics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-api
  template:
    metadata:
      labels:
        app: app-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                n=0; while [ $n -lt 500000 ]; do n=$((n + 1)); done
                sleep 0.5
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              cpu: 900m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-worker
  namespace: {{ .Values.metricsDemo.namespace }}
  labels:
    app: mcp-demo
    scenario: metrics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-worker
  template:
    metadata:
      labels:
        app: app-worker
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                n=0; while [ $n -lt 900000 ]; do n=$((n + 1)); done
                sleep 0.3
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 300m
              memory: 64Mi
            limits:
              cpu: 1500m
              memory: 128Mi
