---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.netedgeDemo.namespace }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: sriov-network
  namespace: {{ .Values.netedgeDemo.namespace }}
  labels:
    app: mcp-demo
    scenario: netedge
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "sriov-network",
      "type": "sriov",
      "vlan": 0,
      "ipam": {
        "type": "host-local",
        "subnet": "10.56.217.0/24",
        "rangeStart": "10.56.217.100",
        "rangeEnd": "10.56.217.200"
      }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: sriov-test-pod
  namespace: {{ .Values.netedgeDemo.namespace }}
  labels:
    app: mcp-demo
    scenario: netedge
  annotations:
    k8s.v1.cni.cncf.io/networks: sriov-network
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      command: ["/bin/sh", "-c", "while true; do sleep 60; done"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
  restartPolicy: Never
