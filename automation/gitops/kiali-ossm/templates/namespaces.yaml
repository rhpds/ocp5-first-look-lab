---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.tempo.operatorNamespace }}
  labels:
    kubernetes.io/metadata.name: {{ .Values.tempo.operatorNamespace }}
    openshift.io/cluster-monitoring: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.tempo.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.istio.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.istio.cniNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
{{- if .Values.bookinfo.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.bookinfo.namespace }}
  labels:
    istio.io/rev: {{ .Values.istio.revision }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
{{- end }}
