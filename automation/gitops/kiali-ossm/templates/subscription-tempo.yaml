---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ .Values.tempo.operatorNamespace }}
  namespace: {{ .Values.tempo.operatorNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: my-tempo-operator
  namespace: {{ .Values.tempo.operatorNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  channel: stable
  installPlanApproval: Automatic
  name: tempo-product
  source: {{ .Values.tempo.subscription.source }}
  sourceNamespace: {{ .Values.subscription.sourceNamespace }}
