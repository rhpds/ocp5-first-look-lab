{{- if and .Values.consoleBuild .Values.consoleBuild.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" .Values.consoleBuild.name "namespace" .Values.argocd.namespace "syncWave" "2") }}
spec:
  ignoreDifferences:
    - group: build.openshift.io
      kind: BuildConfig
      jsonPointers:
        - /spec/failedBuildsHistoryLimit
        - /spec/successfulBuildsHistoryLimit
        - /spec/runPolicy
        - /spec/nodeSelector
        - /spec/postCommit
        - /spec/resources
  destination:
    namespace: {{ .Values.consoleBuild.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: {{ .Values.gitops.basePath }}console-build
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
{{- end }}
