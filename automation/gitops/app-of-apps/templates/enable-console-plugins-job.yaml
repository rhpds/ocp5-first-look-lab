---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enable-console-plugins
  namespace: {{ .Values.argocd.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: enable-console-plugins
rules:
  - apiGroups: ["operator.openshift.io"]
    resources: ["consoles"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: enable-console-plugins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: enable-console-plugins
subjects:
  - kind: ServiceAccount
    name: enable-console-plugins
    namespace: {{ .Values.argocd.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: enable-console-plugins
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: enable-console-plugins
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: enable-plugins
          image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["/bin/bash", "-c"]
          args:
            - |
              PLUGINS=("gitops-plugin" "kuadrant-console-plugin")
              CURRENT=$(oc get console.operator.openshift.io cluster -o jsonpath='{.spec.plugins}')
              for PLUGIN in "${PLUGINS[@]}"; do
                if echo "$CURRENT" | grep -q "$PLUGIN"; then
                  echo "$PLUGIN already enabled"
                else
                  oc patch console.operator.openshift.io cluster --type json \
                    -p "[{\"op\":\"add\",\"path\":\"/spec/plugins/-\",\"value\":\"${PLUGIN}\"}]"
                  echo "$PLUGIN enabled"
                  CURRENT=$(oc get console.operator.openshift.io cluster -o jsonpath='{.spec.plugins}')
                fi
              done
