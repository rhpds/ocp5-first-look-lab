{{- if .Values.agentic.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightspeed-agentic-alerts-adapter
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lightspeed-agentic-alerts-adapter
      app.kubernetes.io/component: alerts-adapter
      app.kubernetes.io/managed-by: lightspeed-operator
      app.kubernetes.io/name: lightspeed-agentic-alerts-adapter
      app.kubernetes.io/part-of: openshift-lightspeed
  template:
    metadata:
      labels:
        app: lightspeed-agentic-alerts-adapter
        app.kubernetes.io/component: alerts-adapter
        app.kubernetes.io/managed-by: lightspeed-operator
        app.kubernetes.io/name: lightspeed-agentic-alerts-adapter
        app.kubernetes.io/part-of: openshift-lightspeed
    spec:
      serviceAccountName: lightspeed-agentic-alerts-adapter
      securityContext:
        runAsNonRoot: true
      volumes:
        - name: config
          configMap:
            name: alerts-adapter-config
      containers:
        - name: adapter
          image: {{ .Values.images.alertsAdapter }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/alerts-adapter
              readOnly: true
          env:
            - name: ALERTMANAGER_URL
              value: https://alertmanager-main.openshift-monitoring.svc:9094
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
{{- end }}
