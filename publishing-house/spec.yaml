project:
  slug: "ocp5-first-look-lab"
  owner_email: "gmidha@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "none"
  showroom_type: "classic"
  intake_type: "new"
  automation_type: "both"
  description: "Red Hat OpenShift 5: First Look Lab"
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-2035"
  workflow_id: "8d9ea05a-af2a-4df8-ac12-803dcb492f86"

spec:
  title: "Red Hat OpenShift 5: First Look"
  learning_objectives:
    - "Explore the OpenShift 5 MCP server by connecting an AI client and invoking live tool calls against a running cluster"
    - "Deploy an agentic troubleshooting workflow to diagnose a failing workload and apply AI-recommended remediation"
    - "Create an AI-generated Perses monitoring dashboard using natural language prompts and refine it iteratively"
    - "Analyze an AI-assisted upgrade risk report and Operator compatibility plan for an OCP 4→5 migration scenario"
    - "Verify a disconnected OCP 5 installation using pre-staged, air-gapped content"
    - "Configure post-quantum cryptography cipher suites on the OCP 5 API server and ingress controller"
    - "Demonstrate oc mirror v2 delta mirroring to selectively synchronize Operator catalog content"
  modules:
    - id: module-01
      title: "Intelligent OpenShift"
      duration_min: 35
      status: not_started
    - id: module-02
      title: "Install & Upgrade"
      duration_min: 30
      status: not_started
    - id: module-03
      title: "RHCOS 10"
      duration_min: 15
      status: not_started
    - id: module-04
      title: "Security, Sovereign & Disconnected"
      duration_min: 20
      status: not_started
    - id: module-05
      title: "Multi-Cluster (Placeholder)"
      duration_min: null
      status: not_started
    - id: module-06
      title: "Other Changes in OpenShift 5 (Placeholder)"
      duration_min: null
      status: not_started
  environment:
    platform: "ocp"            # ocp | rhel-vms — determines which sizing fields apply
    topology: "per-student"    # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | azure | aro | rosa | google | gcp — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "5.0"                 # confirm exact version string at GA
    cluster_type: "multinode"          # sno | multinode — only for platform = ocp
    control_plane_instance_count: 3    # 1 if sno, 3 if multinode
    control_plane_cpu: 16              # 32 if sno, 16 if multinode
    control_plane_ram_gb: 64           # 128 if sno, 64 if multinode
    worker_count: 3                    # number of OCP worker nodes
    worker_cpu: 16                     # vCPU per worker
    worker_ram_gb: 64                  # RAM per worker in GB
    worker_disk_gb: 200                # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: "maas"              # maas | gpu | none
    ai_model_tier: "open-source"       # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products:
      - "Red Hat OpenShift Container Platform 5 (GA expected Oct 2026)"
    non_ga_access_plan: "Specific engineering build (pre-GA)"
    external_services:
      - "registry.redhat.io"
      - "registry.access.redhat.com"
      - "MaaS endpoint (TBD — confirm URL before submission)"
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 2
  audience: "intermediate"   # beginner | intermediate | advanced

