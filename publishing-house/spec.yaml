# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: ""
    catalog_gap: ""
    design_overview: "A two-hour hands-on lab for Solutions Architects, Technical Sales, and Field Engineers who need to understand and demonstrate Red Hat OpenShift 5's new capabilities ahead of the October 2026 GA. Participants explore OCP 5's AI-assisted operations layer (MCP server, agentic troubleshooting, Perses dashboard generation), the redesigned install and upgrade path including air-gapped Agent Installer, RHCOS 10's bootc image-based lifecycle, and the expanded security stack including post-quantum cryptography and oc mirror v2 delta mirroring."
    module_summaries:
      - title: "Intelligent OpenShift"
        overview: "Participants connect an AI client to the OCP 5 MCP gateway to invoke live cluster tool calls, drive an agentic troubleshooting workflow on a pre-broken workload, generate and refine a Perses monitoring dashboard via natural language prompts, and review an AI-assisted upgrade risk report."
      - title: "Install & Upgrade"
        overview: "After watching a video walkthrough of OCP 4→5 architecture changes, participants use the Operator Update Planner to scan for OCP 5 compatibility and simulate a blocked Operator scenario, then execute the final steps of a disconnected Agent Installer deployment against pre-mirrored content."
      - title: "RHCOS 10"
        overview: "Participants inspect node OS details on an OCP 5 cluster using oc debug node, compare RHCOS 10's bootc image-based lifecycle to the prior rpm-ostree model, and observe a day-2 OS update flow that does not require full node reprovisioning."
      - title: "Security, Sovereign & Disconnected"
        overview: "Participants run oc mirror v2 delta mirroring to selectively synchronize an Operator catalog by channel and architecture, then configure post-quantum cryptography cipher suites on the OCP 5 API server and ingress controller and verify the active ciphers via certificate inspection."
      - title: "Multi-Cluster (Placeholder)"
        overview: "Reserved placeholder pending content confirmation with engineering. Will cover multi-cluster management capabilities introduced in OCP 5."
      - title: "Other Changes in OpenShift 5 (Placeholder)"
        overview: "Reserved placeholder covering OCP 5 console UI changes, node management lifecycle changes, and OCP Dedicated/hyperscaler feature availability — all pending content confirmation."
    rcars_overlap_pct: 80
    rcars_top_matches:
      - title: "Taking MCP Servers to Production on OpenShift AI with the Red Hat MCP Registry"
        ci_name: "published.openshift-mcp-lab.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.openshift-mcp-lab.prod"
        relevance_score: 80
        why_it_fits: "Covers MCP server deployment and governance on OpenShift AI with live AI tool calls and agentic workflows."
        workloads:
          - role: "ocp4_workload_litellm_virtual_keys"
            collection: "rhpds.litellm_virtual_keys"
          - role: "ocp4_workload_mcp_user"
            collection: "rhpds.mcp_workloads"
          - role: "ocp4_workload_mcp_with_openshift_validation"
            collection: "rhpds.mcp_workloads"
          - role: "ocp4_workload_toolhive"
            collection: "agnosticd.ai_workloads"
      - title: "OpenShift Lightspeed Demo"
        ci_name: "published.ocp4-lightspeed.prod"
